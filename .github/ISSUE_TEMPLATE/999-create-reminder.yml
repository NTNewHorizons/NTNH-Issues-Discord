name: Create a Reminder
description: Create a reminder for developer(s).
labels:
- "Status: Triage"
body:
- type: markdown
  attributes:
    value: |
      Often developers tell you to create a ticket as reminder so they don't keep forgetting things.

      Choose this one ONLY when instructed to do so.

      Use this for a genuine developer commitment, not a casual joke. Even promised work may take a long time or face community objections; explain the expected benefit below.
- type: input
  id: version
  attributes:
    label: Your Pack Version
    description: What version of the pack are you playing?
    placeholder: "Example: 2.1.1.0"
  validations:
    required: true
- type: textarea
  id: request
  attributes:
    label: Original Request
    description: What did you request?
    placeholder: "Example: Struggling with power generation."
  validations:
    required: true
- type: textarea
  id: promise
  attributes:
    label: Developer's Promise
    description: What did the developer promise? Rephrase it in your own words and note the benefit.
    placeholder: "Example: Glease promised to add a new power generation option based on magic."
  validations:
    required: true
- type: input
  id: dev
  attributes:
    label: Responding developer
    description: Who instructed you to create this? Mention them with @.
    placeholder: "Example: @Glease."
  validations:
    required: true
- type: textarea
  id: context
  attributes:
    label: Context
    description: "Discord message links: your request, the promise, and the instruction."
    placeholder: "Example: https://discord.com/channels/1111111111111111/1111111111111111/1111111111111111, https://discord.com/channels/222222222222222/222222222222222/222222222222222"
  validations:
    required: true
