name: 'Request New Feature'
description: Request a new feature.
labels: 
- "Status: Triage"
- "Suggestion"
body:
- type: markdown
  attributes:
    value: |
      Examples of this category include: add void miners, add a naquadah processing line.

      Please note that if you want to change an existing feature, e.g. think something is too OP, you should use the Suggest a Change template instead.

      Search existing issues first; add supporting details to a closed suggestion if you want it reconsidered. Suggestions may not be implemented due to limited interest or community objections.

      Check the latest release first; your feature may already be in it.
- type: input
  id: version
  attributes:
    label: Your Pack Version
    description: The pack version you are playing. If it is old, try updating first.
    placeholder: "Example: 2.1.1.0"
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: Your Proposal
    description: What do you propose? Please describe it briefly in one or two sentence.
    placeholder: "Example: Add a mega PA."
  validations:
    required: true
- type: textarea
  id: goal
  attributes:
    label: Your Goal
    description: Why is it needed? If something similar exists, say why it is not enough.
    placeholder: "Example: PAs are too small for my tastes."
  validations:
    required: true
- type: textarea
  id: vision
  attributes:
    label: Your Vision
    description: How do you think your vision would improve the pack?
    placeholder: "Example: A mega PA would make everyone's base a nicer place and improve the overall quality of game experience."
  validations:
    required: true
