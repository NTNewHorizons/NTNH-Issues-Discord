name: Report Bug
description: "Report a bug that does not abruptly end a game session or prevent the start of the game."
labels:
- "Status: Triage"
- "Bug: Minor"
body:
- type: markdown
  attributes:
    value: |
      Examples of this category include: item duping, item voiding, cannot craft item, behavior and description does not match.

      Please note if you merely want a change, e.g. think something is too OP, you should use the Suggest a Change template instead.

      Search existing issues first. If this bug was reported in a closed issue, add your details there so we can investigate and reopen it if confirmed. Check the latest official and dev releases in case it is already fixed.
- type: input
  id: discord
  attributes:
    label: Your NTNH Discord Username
    description: Leave empty if you don't have one, but this will make it harder to contact you if we need additional info.
    placeholder: "Example: Fake"
- type: textarea
  id: version
  attributes:
    label: Pack Version and Server Setup
    description: Include your pack version, server name (or SP), and whether you play single player, Open To LAN, or on a dedicated server. For servers, include the software if known (Vanilla Forge, Crucible, Thermos, Ultramine, or another MCPC+ fork). Open To LAN means opening a single-player world through the ESC menu. Listing software does not imply support; unknown is fine.
    placeholder: "Example: 2.1.1.0, private dedicated server, Crucible."
  validations:
    required: true
- type: textarea
  id: expectation
  attributes:
    label: Expected and Actual Behavior
    description: What were you trying to do, what did you expect, and what happened instead? Attach screenshots if helpful.
    placeholder: "Example: Crafting Foo should consume 1 Bar, but I get 1 Foo without losing any Bar."
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Steps and Reproducibility
    description: Give the steps to reproduce. Say whether it happens consistently and whether others tried the steps and saw the same problem. If testing is unnecessary (e.g. an obvious recipe loophole) or has not been done, say so.
    placeholder: "Example: Put 1 Bar in the crafting grid and take Foo. Happens every time; others have not tested it."
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: Your Proposal
    description: Please describe it briefly in one or two sentences.
    placeholder: "Example: Consume 1 Bar properly."
  validations:
    required: true
