name: Report Bug
description: "Report a bug that does not abruptly end a game session or prevent the start of the game."
labels:
- "Status: Triage"
- "Bug: Minor"
body:
- type: markdown
  attributes:
    value: |
      Examples of this category include: item duping, item voiding, cannot craft item, behavior and description does not match.

      Please note if you merely want a change, e.g. think something is too OP, you should use the Suggest a Change template instead.

      Search existing issues first. If this bug was reported in a closed issue, add your details there so we can investigate and reopen it if confirmed. Check the latest official and dev releases in case it is already fixed.

      Open To LAN means opening a single-player world from the ESC menu. Server software is noted for info, not support.

      If the bug needs no reproduction step (e.g. an obvious recipe loophole), just say so in the steps.
- type: textarea
  id: version
  attributes:
    label: Pack Version and Server Setup
    description: Pack version, server name (or SP), and server software if known. Unknown is fine.
    placeholder: "Example: 2.1.1.0, private dedicated server, Crucible."
  validations:
    required: true
- type: textarea
  id: expectation
  attributes:
    label: Your Expectation
    description: What did you try to do, and what did you expect to happen? Attach screenshots if helpful.
    placeholder: "Example: Trying to craft Foo. Expect to consume 1 Bar and get 1 Foo."
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: The Reality
    description: What happened instead? Attach screenshots if helpful.
    placeholder: "Example: 1 Foo is crafted but no Bar is consumed."
  validations:
    required: true
- type: textarea
  id: repro
  attributes:
    label: Steps and Reproducibility
    description: Steps to reproduce. Say if it repeats every time and if others see it too.
    placeholder: "Example: Put 1 Bar in the crafting grid and take Foo. Happens every time; others have not tested it."
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: Your Proposal
    description: Please describe it briefly in one or two sentences.
    placeholder: "Example: Consume 1 Bar properly."
  validations:
    required: true
