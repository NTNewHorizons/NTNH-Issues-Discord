name: Suggest a New Mod
description: Suggest the addition of a new mod.
labels:
- "Status: Triage"
- "Type: Mod Addition"
- "Suggestion"
body:
- type: markdown
  attributes:
    value: |
      Only mods with an open source license are eligible. Search existing issues first; add supporting details to a closed suggestion if you want it reconsidered. Suggestions may not be implemented due to limited interest or community objections.
- type: input
  id: version
  attributes:
    label: Your Pack Version
    description: What version of the pack are you playing?
    placeholder: "Example: 2.1.1.0"
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: Mod, License, and Your Role
    description: Mod name, source link, and open source license. Are you its 1.7.10 author or maintainer?
    placeholder: "Example: GigaGramFab; source URL; MIT license; I am not the author or maintainer."
  validations:
    required: true
- type: textarea
  id: features
  attributes:
    label: The Mod to Add
    description: What is the main feature of this mod?
    placeholder: "Example: More processing lines. More ores. More dimensions."
  validations:
    required: true
- type: textarea
  id: reason
  attributes:
    label: Your Reason
    description: Why is this mod needed? If similar things exist, say why they are not enough.
    placeholder: "Example: Enrich the exploration experience of the pack!"
  validations:
    required: true
- type: textarea
  id: test
  attributes:
    label: Preliminary Investigation
    description: If you tested the mod in the pack, what happened? Say so if you have not tested it.
    placeholder: >
      Example: 
      The recipe needs to be gregified. 
      There are no hard conflicts like crashing. 
      X system works poorly when used with Y feature from an existing mod.
      The magic side of the pack integrates with the tech progression better.
  validations:
    required: true
