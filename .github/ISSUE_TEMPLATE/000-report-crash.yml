name: Report Crash
description: "Report a bug that abruptly ends a game session or prevents the start of the game."
labels:
- "Crash"
- "Status: Triage"
body:
- type: markdown
  attributes:
    value: |
      Examples of this category include: crashing to desktop, game window disappearing, uncommanded computer shutdown. ~~Please blame your local power grid if your neighbor's computer also shut down due to power outage.~~

      Please note if you merely want a change, e.g. think something is too OP, you should use the Suggest a Change template instead.

      Search existing issues first. If this crash was reported in a closed issue, add your details there so we can investigate and reopen it if confirmed.

      If you play an old version, try updating first; we fix many issues per release, and dev builds exist between official releases.

      Open To LAN means opening a single-player world from the ESC menu. Server software being listed does not mean it is supported.
- type: input
  id: version
  attributes:
    label: Your Pack Version
    description: The pack version you are playing. If it is old, try updating first.
    placeholder: "Example: 2.1.1.0"
  validations:
    required: true
- type: input
  id: server
  attributes:
    label: Your Server
    description: On which server does this happen? Type SP if you are not playing on a dedicated server.
    placeholder: "Example: Eta, ProsperCraft, private server, SP"
  validations:
    required: true
- type: dropdown
  id: thermos
  attributes:
    label: Type of Server
    description: Server software brand. Being listed here does not mean it is supported.
    options:
    - Single Player
    - Open To LAN
    - Vanilla Forge
    - Crucible
    - Thermos
    - Ultramine
    - Other MCPC+ fork
    - "Don't know"
  validations:
    required: true
- type: textarea
  id: reproduce
  attributes:
    label: Actions and Reproducibility
    description: Steps before the crash, and whether it repeats or others crash too.
    placeholder: "Example: Trying to craft Foo. Expect to consume 1 Bar and get 1 Foo."
  validations:
    required: true
- type: textarea
  id: report
  attributes:
    label: Crash Report
    description: "Paste it here. Without one, attach `logs/fml-client-latest.log` or `logs/fml-server-latest.log`."
    placeholder: "Example: pastebin/something OR submit the file to github by dragging it to this textbox."
  validations:
    required: true
